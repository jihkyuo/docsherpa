name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: setup-docs
        run: cd skills/setup-docs/scripts && uv run --with pytest pytest -q
      - name: doc-health
        run: cd skills/doc-health/scripts && uv run --with pytest pytest -q
      - name: doc-reconcile parity harness
        run: cd skills/doc-reconcile/parity && uv run --with pytest pytest -q
      - name: 도달성 게이트 (자기 dogfood)
        run: python3 skills/setup-docs/scripts/gate.py . --require-markers
